<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad-synapse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c1b" />
      <stop offset="50%" stop-color="#0d172e" />
      <stop offset="100%" stop-color="#132247" />
    </linearGradient>

    <!-- Cyan Glow Filter -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Violet Glow Filter -->
    <filter id="glow-violet" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Synapse Gradient -->
    <linearGradient id="axon-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7928ca" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.9" />
    </linearGradient>

    <!-- Dopamine Sphere Radial Gradient -->
    <radialGradient id="dopamine-glob">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0" />
    </radialGradient>

    <!-- Post-Synaptic Membrane Gradient -->
    <linearGradient id="membrane-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#ff0080" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="450" fill="url(#bg-grad-synapse)" />

  <!-- Grid Pattern Overlay -->
  <g opacity="0.07" stroke="#00f2fe" stroke-width="1">
    <path d="M0 50 H800 M0 100 H800 M0 150 H800 M0 200 H800 M0 250 H800 M0 300 H800 M0 350 H800 M0 400 H800" />
    <path d="M100 0 V450 M200 0 V450 M300 0 V450 M400 0 V450 M500 0 V450 M600 0 V450 M700 0 V450" />
  </g>

  <!-- Pre-Synaptic Axon Terminal (Left/Top Bulb) -->
  <path d="M -50,150 Q 150,120 260,180 Q 320,210 330,280 Q 320,350 220,380 Q 120,400 -50,420 Z" 
        fill="url(#bg-grad-synapse)" stroke="#7928ca" stroke-width="3" filter="url(#glow-violet)" opacity="0.95"/>
  <path d="M -30,170 Q 140,140 240,195 Q 290,225 300,280 Q 290,335 210,360 Q 120,380 -30,400" 
        fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.6"/>

  <!-- Post-Synaptic Membrane (Right/Bottom Wall) -->
  <path d="M 470,80 Q 430,220 470,380 L 850,420 L 850,50 Z" 
        fill="url(#bg-grad-synapse)" stroke="#00f2fe" stroke-width="3" filter="url(#glow-cyan)"/>
  
  <!-- Post-Synaptic Receptor Channels -->
  <g stroke="url(#membrane-grad)" stroke-width="3" fill="#0d172e">
    <!-- Receptor 1 -->
    <path d="M 445 130 C 430 130, 430 160, 445 160 C 460 160, 465 145, 475 145" />
    <!-- Receptor 2 -->
    <path d="M 435 210 C 420 210, 420 240, 435 240 C 450 240, 455 225, 465 225" />
    <!-- Receptor 3 -->
    <path d="M 438 290 C 423 290, 423 320, 438 320 C 453 320, 458 305, 468 305" />
  </g>

  <!-- Axon Action Potential Waveform -->
  <path d="M 10 220 Q 60 180 110 220 T 210 220 T 310 220" 
        fill="none" stroke="#00f2fe" stroke-width="3" filter="url(#glow-cyan)"/>

  <!-- Synaptic Vesicles (Inside Pre-synaptic Terminal) -->
  <g filter="url(#glow-cyan)">
    <circle cx="150" cy="240" r="16" fill="#070c1b" stroke="#00f2fe" stroke-width="2"/>
    <circle cx="150" cy="240" r="6" fill="#00f2fe"/>
    
    <circle cx="210" cy="280" r="18" fill="#070c1b" stroke="#7928ca" stroke-width="2"/>
    <circle cx="210" cy="280" r="7" fill="#ff0080"/>

    <circle cx="260" cy="230" r="15" fill="#070c1b" stroke="#00f2fe" stroke-width="2"/>
    <circle cx="260" cy="230" r="5" fill="#00f2fe"/>

    <circle cx="280" cy="300" r="14" fill="#070c1b" stroke="#ff0080" stroke-width="2"/>
    <circle cx="280" cy="300" r="5" fill="#ff0080"/>
  </g>

  <!-- Released Dopamine Molecules in Synaptic Cleft -->
  <g filter="url(#glow-cyan)">
    <circle cx="360" cy="210" r="10" fill="url(#dopamine-glob)" />
    <circle cx="360" cy="210" r="4" fill="#ffffff" />
    <path d="M 360 210 L 380 190" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="2,2"/>

    <circle cx="390" cy="250" r="12" fill="url(#dopamine-glob)" />
    <circle cx="390" cy="250" r="5" fill="#ffffff" />

    <circle cx="370" cy="310" r="9" fill="url(#dopamine-glob)" />
    <circle cx="370" cy="310" r="3.5" fill="#ffffff" />

    <circle cx="410" cy="180" r="11" fill="url(#dopamine-glob)" />
    <circle cx="410" cy="180" r="4" fill="#ffffff" />

    <circle cx="415" cy="295" r="10" fill="url(#dopamine-glob)" />
    <circle cx="415" cy="295" r="4" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Noribogaine Re-uptake Modulation Ring (Biological Anchor) -->
  <g transform="translate(325, 275)" filter="url(#glow-violet)">
    <circle cx="0" cy="0" r="28" fill="none" stroke="#ff0080" stroke-width="2" stroke-dasharray="8,4"/>
    <circle cx="0" cy="0" r="36" fill="none" stroke="#00f2fe" stroke-width="1" stroke-dasharray="4,6"/>
    <polygon points="0,-12 10,6 -10,6" fill="#00f2fe" opacity="0.8"/>
  </g>

  <!-- High-Tech HUD & Telemetry Text Overlay -->
  <g font-family="'Space Grotesk', 'JetBrains Mono', sans-serif" fill="#94a3b8">
    <text x="30" y="45" font-size="14" font-weight="700" fill="#00f2fe" letter-spacing="2">SYNAPTIC DYNAMICS // DOPAMINE RECEPTOR PATHWAY</text>
    <text x="30" y="65" font-size="11" fill="#64748b" letter-spacing="1">NORIBOGAINE SEROTONIN &amp; DOPAMINE RE-UPTAKE TRANSPORTER (DAT)</text>
    
    <!-- HUD Target Reticle (Top Right) -->
    <circle cx="730" cy="55" r="22" fill="none" stroke="#00f2fe" stroke-width="1.5" opacity="0.7"/>
    <circle cx="730" cy="55" r="4" fill="#00f2fe"/>
    <line x1="700" y1="55" x2="760" y2="55" stroke="#00f2fe" stroke-width="1" opacity="0.5"/>
    <line x1="730" y1="25" x2="730" y2="85" stroke="#00f2fe" stroke-width="1" opacity="0.5"/>
    <text x="650" y="95" font-size="10" fill="#00f2fe" font-weight="600">D1/D2 BINDING AFFINITY: 4.2nM</text>

    <!-- Cleft Width Indicator -->
    <line x1="330" y1="390" x2="430" y2="390" stroke="#00f2fe" stroke-width="1.5"/>
    <line x1="330" y1="383" x2="330" y2="397" stroke="#00f2fe" stroke-width="1.5"/>
    <line x1="430" y1="383" x2="430" y2="397" stroke="#00f2fe" stroke-width="1.5"/>
    <text x="345" y="412" font-size="10" fill="#00f2fe" font-weight="600" letter-spacing="1">SYNAPTIC CLEFT: 20nm</text>

    <!-- Biological Callouts -->
    <rect x="520" y="140" width="220" height="50" rx="8" fill="#0d172e" stroke="#7928ca" stroke-width="1.5" opacity="0.9"/>
    <text x="535" y="160" font-size="11" font-weight="700" fill="#f8fafc">Ventral Striatum Post-Synapse</text>
    <text x="535" y="177" font-size="10" fill="#38ef7d">D2 Receptor Sensitivity: Normalizing</text>

    <rect x="520" y="270" width="220" height="50" rx="8" fill="#0d172e" stroke="#00f2fe" stroke-width="1.5" opacity="0.9"/>
    <text x="535" y="290" font-size="11" font-weight="700" fill="#f8fafc">Iboga Alkaloid Reset</text>
    <text x="535" y="307" font-size="10" fill="#00f2fe">GDNF Neurotrophin Upregulated</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad-cortical" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c1b" />
      <stop offset="50%" stop-color="#0d172e" />
      <stop offset="100%" stop-color="#132247" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow-cyan-cortical" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-violet-cortical" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Linear Node Vector Gradients -->
    <linearGradient id="line-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#7928ca" />
      <stop offset="100%" stop-color="#ff0080" />
    </linearGradient>

    <linearGradient id="wave-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7928ca" stop-opacity="0" />
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="1" />
      <stop offset="100%" stop-color="#38ef7d" stop-opacity="1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg-grad-cortical)" />

  <!-- Cyber Grid -->
  <g opacity="0.08" stroke="#00f2fe" stroke-width="1">
    <path d="M0 75 H800 M0 150 H800 M0 225 H800 M0 300 H800 M0 375 H800" />
    <path d="M133 0 V450 M266 0 V450 M400 0 V450 M533 0 V450 M666 0 V450" />
  </g>

  <!-- Stylized Brain Contour (Cortical Outer Curve & Ventral Arc) -->
  <g filter="url(#glow-violet-cortical)" opacity="0.85">
    <!-- Frontal Lobe to Occipital Lobe Arc -->
    <path d="M 220 280 C 180 180, 240 80, 390 70 C 540 60, 640 140, 620 250 C 610 300, 560 360, 480 370 C 400 380, 300 360, 220 280 Z" 
          fill="none" stroke="#7928ca" stroke-width="2.5" stroke-dasharray="10,5"/>
    
    <!-- Cerebellum & Ventral Striatum Sub-structure Arcs -->
    <path d="M 480 370 C 530 400, 600 390, 610 320 Q 560 310 500 330 Z" 
          fill="#0d172e" stroke="#00f2fe" stroke-width="1.5"/>
  </g>

  <!-- Cortical Impulse Mesh Network (Nodes & Vector Connections) -->
  <g stroke="url(#line-grad-1)" stroke-width="1.5" opacity="0.9">
    <!-- Prefrontal Cortex Cluster -->
    <line x1="280" y1="140" x2="330" y2="110" />
    <line x1="330" y1="110" x2="400" y2="130" />
    <line x1="280" y1="140" x2="350" y2="180" />
    <line x1="350" y1="180" x2="400" y2="130" />

    <!-- Ventral Striatum / Nucleus Accumbens Hub -->
    <line x1="350" y1="180" x2="410" y2="240" stroke-width="3" filter="url(#glow-cyan-cortical)" />
    <line x1="400" y1="130" x2="410" y2="240" stroke-width="2" />
    <line x1="410" y1="240" x2="480" y2="220" />
    <line x1="410" y1="240" x2="450" y2="290" />
    <line x1="480" y1="220" x2="530" y2="160" />
    <line x1="530" y1="160" x2="570" y2="210" />
    <line x1="480" y1="220" x2="570" y2="210" />
    <line x1="450" y1="290" x2="520" y2="310" />
    <line x1="520" y1="310" x2="570" y2="270" />
    <line x1="570" y1="210" x2="570" y2="270" />
  </g>

  <!-- Glowing Vertex Node Points -->
  <g filter="url(#glow-cyan-cortical)">
    <!-- Prefrontal Nodes -->
    <circle cx="280" cy="140" r="5" fill="#00f2fe" />
    <circle cx="330" cy="110" r="6" fill="#7928ca" />
    <circle cx="400" cy="130" r="6" fill="#00f2fe" />
    <circle cx="350" cy="180" r="7" fill="#ff0080" />

    <!-- Nucleus Accumbens Central Hotspot -->
    <circle cx="410" cy="240" r="14" fill="#070c1b" stroke="#00f2fe" stroke-width="3" />
    <circle cx="410" cy="240" r="6" fill="#00f2fe" />
    <circle cx="410" cy="240" r="2" fill="#ffffff" />

    <!-- Parietal / Temporal Nodes -->
    <circle cx="480" cy="220" r="6" fill="#38ef7d" />
    <circle cx="450" cy="290" r="5" fill="#7928ca" />
    <circle cx="530" cy="160" r="6" fill="#00f2fe" />
    <circle cx="570" cy="210" r="5" fill="#ff0080" />
    <circle cx="520" cy="310" r="5" fill="#00f2fe" />
    <circle cx="570" cy="270" r="6" fill="#38ef7d" />
  </g>

  <!-- Cortical Impulse Signal Waves (Bottom Waveforms) -->
  <path d="M 50 380 Q 90 340 130 380 T 210 380 T 290 380 T 370 380 T 450 380 T 530 380 T 610 380 T 690 380" 
        fill="none" stroke="url(#wave-grad)" stroke-width="3" filter="url(#glow-cyan-cortical)"/>
  
  <path d="M 50 395 Q 80 415 110 395 T 170 395 T 230 395 T 290 395 T 350 395 T 410 395 T 470 395 T 530 395 T 590 395 T 650 395" 
        fill="none" stroke="#7928ca" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.7"/>

  <!-- High-Tech Telemetry HUD & Callouts -->
  <g font-family="'Space Grotesk', 'JetBrains Mono', sans-serif" fill="#94a3b8">
    <text x="30" y="45" font-size="14" font-weight="700" fill="#00f2fe" letter-spacing="2">CORTICAL IMPULSE MAPPING // VENTRAL STRIATUM</text>
    <text x="30" y="65" font-size="11" fill="#64748b" letter-spacing="1">PREFRONTAL CORTEX (PFC) &amp; NUCLEUS ACCUMBENS REGULATION</text>

    <!-- Radar Sweep Target Circle (Upper Right) -->
    <g transform="translate(710, 80)">
      <circle cx="0" cy="0" r="32" fill="none" stroke="#00f2fe" stroke-width="1.5" opacity="0.6"/>
      <circle cx="0" cy="0" r="20" fill="none" stroke="#7928ca" stroke-width="1" stroke-dasharray="6,3"/>
      <circle cx="0" cy="0" r="4" fill="#38ef7d"/>
      <line x1="-40" y1="0" x2="40" y2="0" stroke="#00f2fe" stroke-width="1" opacity="0.4"/>
      <line x1="0" y1="-40" x2="0" y2="40" stroke="#00f2fe" stroke-width="1" opacity="0.4"/>
      <text x="-45" y="48" font-size="9" fill="#00f2fe" font-weight="600">40Hz GAMMA WAVE</text>
    </g>

    <!-- Callout Box 1: Prefrontal Executive Control -->
    <rect x="50" y="110" width="200" height="54" rx="8" fill="#0d172e" stroke="#00f2fe" stroke-width="1.5" opacity="0.9"/>
    <text x="65" y="130" font-size="11" font-weight="700" fill="#f8fafc">Prefrontal Control (PFC)</text>
    <text x="65" y="148" font-size="10" fill="#38ef7d">Impulse Inhibitory Tone: +142%</text>

    <!-- Callout Box 2: Ventral Striatum Modulation -->
    <rect x="50" y="240" width="210" height="54" rx="8" fill="#0d172e" stroke="#ff0080" stroke-width="1.5" opacity="0.9"/>
    <text x="65" y="260" font-size="11" font-weight="700" fill="#f8fafc">Ventral Striatum Hotspot</text>
    <text x="65" y="278" font-size="10" fill="#ff0080">Compulsive Loop Decoupled</text>

    <!-- Status Bar (Bottom Right) -->
    <rect x="550" y="320" width="220" height="40" rx="6" fill="#070c1b" stroke="#7928ca" stroke-width="1"/>
    <text x="565" y="344" font-size="10" font-weight="600" fill="#00f2fe" letter-spacing="1">IMPULSE INDEX: OPTIMAL (0.14)</text>
  </g>
</svg>
